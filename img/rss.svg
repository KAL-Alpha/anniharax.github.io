<?xml version="1.0" encoding="UTF-8"?>
<!--
  Frutiger Aero 风格的 RSS 订阅图标
  玻璃质感的蓝色圆角方块（顶部玻璃高光 + 底部反光）+ 白色 RSS 电波符号，
  与 Windows Vista / 7 时代的 Aero 图标观感一致。
  源文件（矢量）：themes/aero/source/img/rss.svg
  位图：rss.png（128×128，rsvg-convert 渲染）
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
    <defs>
        <!-- 玻璃主体 -->
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e6f5ff"/>
            <stop offset="24%" stop-color="#a5d4f2"/>
            <stop offset="54%" stop-color="#4c93ca"/>
            <stop offset="86%" stop-color="#2a6ba3"/>
            <stop offset="100%" stop-color="#62a8d8"/>
        </linearGradient>
        <!-- 顶部玻璃高光 -->
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <!-- 边缘描边 -->
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="50%" stop-color="#7cbfe9" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#1b5583"/>
        </linearGradient>
        <!-- 底部反光 -->
        <radialGradient id="under" cx="0.5" cy="1" r="0.85">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3.2"/>
        </filter>
        <filter id="dropshadow" x="-30%" y="-30%" width="160%" height="180%">
            <feDropShadow dx="0" dy="2.6" stdDeviation="3.2" flood-color="#0a2c49" flood-opacity="0.42"/>
        </filter>
        <clipPath id="tile">
            <rect x="8" y="8" width="112" height="112" rx="26" ry="26"/>
        </clipPath>
    </defs>

    <g filter="url(#dropshadow)">
        <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#body)"/>
    </g>

    <g clip-path="url(#tile)">
        <!-- 顶部玻璃高光 -->
        <path d="M4 4 H124 V58 C98 74 30 74 4 56 Z" fill="url(#gloss)"/>
        <!-- 底部反光 -->
        <ellipse cx="64" cy="126" rx="56" ry="20" fill="url(#under)"/>
        <!-- 玻璃厚度内描边 -->
        <rect x="9" y="9" width="110" height="110" rx="25" ry="25" fill="none"
              stroke="#0d4270" stroke-opacity="0.28" stroke-width="2"/>
        <rect x="12" y="12" width="104" height="104" rx="22" ry="22" fill="none"
              stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4"/>

        <!-- RSS 电波符号 -->
        <g fill="none" stroke="#ffffff" stroke-width="12.5">
            <path d="M35 70 A28 28 0 0 1 63 98"/>
            <path d="M35 43 A55 55 0 0 1 90 98"/>
        </g>
        <circle cx="35" cy="98" r="6.6" fill="#ffffff"/>
    </g>

    <!-- 玻璃边缘描边 + 顶部高光条 -->
    <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="none"
          stroke="url(#rim)" stroke-width="2.4"/>
    <path d="M26 20 H102" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3.5"
          stroke-linecap="round" filter="url(#soften)"/>
</svg>
